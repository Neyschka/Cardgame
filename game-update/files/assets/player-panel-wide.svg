    <rect x="236" y="118" width="52" height="36" rx="8" fill="#120a22" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>
    <rect x="296" y="118" width="52" height="36" rx="8" fill="#120a22" stroke="#c9a227" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>
