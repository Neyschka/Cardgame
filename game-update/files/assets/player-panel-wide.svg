<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" color="#ef4444">
  <defs>
    <linearGradient id="goldW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d98a"/><stop offset="100%" stop-color="#8a6a14"/>
