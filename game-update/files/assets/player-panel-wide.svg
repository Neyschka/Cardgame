  <rect id="panel-edge" x="3" y="3" width="634" height="174" rx="16" fill="none" stroke="currentColor" stroke-width="3"/>
  <rect x="10" y="10" width="620" height="160" rx="11" fill="none" stroke="url(#goldW)" stroke-width="1.2" opacity="0.7"/>
  <rect id="panel-accent" x="3" y="3" width="9" height="174" rx="4" fill="currentColor"/>

  <rect id="portrait" x="28" y="26" width="128" height="128" rx="12" fill="#120a22" stroke="url(#goldW)" stroke-width="2"/>
  <path d="M92 66a22 22 0 1 1 0 44 22 22 0 0 1 0-44M56 136a36 36 0 0 1 72 0" fill="none" stroke="currentColor" stroke-width="3" opacity="0.75"/>

